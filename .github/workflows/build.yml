name: Build Lead Tweak

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Theos
        uses: waruhachi/theos-action@v2.4.6
        with:
          theos-src: 'waruhachi/theos'
          theos-branch: 'main'
          sdks-src: 'waruhachi/sdks'
          sdks-branch: 'main'

      - name: Install dpkg
        run: brew install dpkg

      - name: Build packages
        run: make clean package FINALPACKAGE=1

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: lead-packages
          path: |
            packages/*.deb
            packages/Lead.dylib
